services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
      - "8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-super_chave_secreta_para_desenvolvimento_local_12345}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres.your-tenant-id:124c92be406d143842e01a4c0c09fb1c@136.248.126.192:5432/postgres}
      - DB_SCHEMA=${DB_SCHEMA:-3dprintcalc}
      - PORT=80
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/api/health || curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      default:
        aliases:
          - app
          - 3dprintcalc
          - web

volumes:
  app_data:
    driver: local
