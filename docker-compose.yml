services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
      - "8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_random_secure_secret_in_easypanel}
      - DATABASE_URL=sqlite:////app/data/prod.db
      - PORT=80
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/api/health || curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      default:
        aliases:
          - app
          - 3dprintcalc
          - web

volumes:
  app_data:
    driver: local
